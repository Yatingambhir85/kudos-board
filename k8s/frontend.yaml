apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: kudos-board
data:
  VITE_API_URL: http://backend:5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: kudos-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: kudos-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: frontend-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: kudos-board
spec:
  selector:
    app: frontend
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    nodePort: 30080

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kudos-network-policy
  namespace: kudos-board
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kudos-board
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: kudos-board
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
