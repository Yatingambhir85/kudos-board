apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: kudos-board
data:
  PORT: "5000"
  NODE_ENV: production
  MONGO_URI: mongodb://mongodb:27017/kudosboard
  ALLOWED_ORIGINS: "*"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kudos-board
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: kudos-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: backend-config
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kudos-board
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
