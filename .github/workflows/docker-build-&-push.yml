name: Docker Image Build & Push

on: 
  workflow_dispatch:

jobs:
  build_push:
    runs-on: ubuntu-22.04
    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          username: ${{vars.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_PASSWORD}}
      - name: Build & Push to Dockerhub - Frontend
        uses: docker/build-push-action@v6
        with:
         context: frontend/Dockerfile
         push: true
         tags: |
           ${{ vars.DOCKERHUB_USERNAME }}/kudos-board-frontend:latest
      - name: Build & Push to Dockerhub - Backend
        uses: docker/build-push-action@v6
        with:
         context: backend/Dockerfile
         push: true
         tags: |
           ${{ vars.DOCKERHUB_USERNAME }}/kudos-board-backend:latest
        
